er:`<svg viewBox="0 0 520 250"><rect class="s" x="10" y="10" width="90" height="38"/><text x="55" y="34">Entity</text><rect class="s" x="130" y="10" width="90" height="38"/><rect class="s" x="135" y="15" width="80" height="28" style="fill:none"/><text x="175" y="34">Weak Ent.</text><ellipse class="s" cx="290" cy="29" rx="45" ry="20"/><text x="290" y="34">Attribute</text><ellipse class="s" cx="410" cy="29" rx="45" ry="20" style="stroke-dasharray:5 4"/><text x="410" y="34">Derived</text><polygon class="s" points="55,70 100,95 55,120 10,95"/><text x="55" y="99">Relation</text><ellipse class="s" cx="175" cy="95" rx="45" ry="20"/><ellipse class="s" cx="175" cy="95" rx="38" ry="14" style="fill:none"/><text x="175" y="99" style="font-size:11px">Multi-val</text><text class="m" x="360" y="99">Line = connection · Underline = Primary Key</text><rect class="s pl" x="20" y="170" width="100" height="40"/><text x="70" y="195">Student</text><polygon class="s" points="260,160 315,190 260,220 205,190"/><text x="260" y="194">Enrolls</text><rect class="s pl" x="400" y="170" width="100" height="40"/><text x="450" y="195">Course</text><path class="l" d="M120 190H205M315 190H400"/><text class="m" x="165" y="182">M</text><text class="m" x="360" y="182">N</text></svg>`,

const sec=[
["A","Section A · 2 marks (50 words) · Attempt 5",[
["Functional Dependency (FD) kya hai?","2026, 2024",`<b>FD</b> ka matlab: agar attribute <b>A</b> ki value pata ho to <b>B</b> ki value uniquely tay ho jaati hai. Likhte hain <b>A → B</b> (A = determinant, B = dependent).<br>Ex: <code>RollNo → Name</code> (ek roll no. ka ek hi naam).`],
["Log files kya hoti hain?","2026, 2024",`Database ke har update ka <b>sequential record</b> (T-id, data item, old value, new value, commit/abort). System crash ke baad <b>undo/redo</b> karke recovery isi se hoti hai.`],
["DBA ki responsibilities","5 times",`<ul><li>Schema design & storage structure</li><li>Security: user accounts, access rights</li><li>Backup & recovery</li><li>Performance tuning</li><li>Integrity maintain karna, users ko guide karna</li></ul>`],
["Strong vs Weak Entity Set","2026, 2025",`<table><tr><th></th><th>Strong</th><th>Weak</th></tr><tr><td>Primary key</td><td>Apni hoti hai</td><td>Nahi, sirf partial key</td></tr><tr><td>Symbol</td><td>Single rectangle</td><td>Double rectangle</td></tr><tr><td>Dependency</td><td>Independent</td><td>Owner entity par depend</td></tr><tr><td>Ex</td><td>Employee</td><td>Dependent (bachche)</td></tr></table>`],
["Recovery ka concept","2026, 2024",`Failure (crash, power cut) ke baad DB ko <b>last consistent state</b> me wapas laana. Tools: <b>log, checkpoint, backup</b>. Committed txn → REDO, uncommitted txn → UNDO.`],
["Integrity constraints ka role","2025, 2024, 2023",`Data ko <b>sahi, valid aur consistent</b> rakhte hain. Galat insert/update rok dete hain. Types: domain, entity, referential, key, not-null. Ex: age &gt; 0, PK NULL nahi ho sakti.`],
["Data Independence kya hai?","4 times",`Ek level ka schema badalne par <b>upar wale level ko change na karna pade</b>. <b>Physical</b> (storage badla, logical same) aur <b>Logical</b> (conceptual badla, views/programs same).`],
["Transitive dependency demonstrate karo","2025",`Agar <b>A→B</b> aur <b>B→C</b> (B key nahi) to <b>A→C</b> transitive hai.<br>Ex: <code>RollNo→Dept</code>, <code>Dept→HOD</code> ⇒ <code>RollNo→HOD</code>. Ye <b>3NF violate</b> karta hai.`],
["File processing system ke disadvantages","2025",`<ul><li>Data redundancy & inconsistency</li><li>Data isolation (alag formats)</li><li>Program–data dependence</li><li>Weak security, no concurrency control</li><li>Recovery/backup mushkil</li></ul>`],
["Normalizing data ka matlab","2024",`Table ko chhote tables me todna (1NF→BCNF rules se) taaki <b>redundancy kam ho</b> aur insertion/deletion/update anomalies khatam ho jaayein.`],
["Foreign key kab valid nahi hoti?","2024",`Jab FK ki value parent table ki <b>Primary Key me exist hi na kare</b> (orphan record). Sirf <b>NULL</b> allowed hai. Ex: Emp.DeptID=99 par Dept me 99 nahi.`],
["SQL me User Defined Functions","2024",`Khud ka banaya function jo value/table return karta hai, SELECT me use hota hai.<pre>CREATE FUNCTION tax(sal INT)\nRETURNS INT\nBEGIN RETURN sal*0.1; END;\nSELECT name, tax(salary) FROM emp;</pre>`],
["Deadlock kya hai? Kab hota hai?","2026, 2025",`Do ya zyada transactions ek dusre ke locked resource ka wait karte hain aur <b>koi aage nahi badh pata</b>. Tab hota hai jab <b>circular wait</b> bane.<div class="dg">{{dead}}</div>`]]],
["B","Section B · 5 marks (100 words) · Attempt 5 out of 8",[
["Keys: Super, Candidate, Primary (examples)","5 times, must do",`<b>Student(RollNo, Email, Name, Phone)</b><ul><li><b>Super key:</b> koi bhi set jo row ko unique kare – {RollNo}, {RollNo,Name}, {Email,Phone}</li><li><b>Candidate key:</b> minimal super key – {RollNo}, {Email}</li><li><b>Primary key:</b> candidate me se chuni hui, NULL nahi – RollNo</li><li><b>Alternate:</b> bachi candidate – Email</li><li><b>Foreign key:</b> dusre table ki PK ko refer karti hai</li></ul>Yaad rakho: Primary ⊂ Candidate ⊂ Super.<br><b>Detail:</b> <b>Super key</b> me extra attributes ho sakte hain, isliye ek table me kai super keys hoti hain. <b>Candidate key</b> me se koi attribute hata do to uniqueness tut jati hai (minimal). <b>Primary key</b> ek hi hoti hai, NULL aur duplicate nahi. <b>Composite key:</b> 2+ attributes milkar key, jaise (Roll, Course). <b>Foreign key:</b> child table ka column jo parent ki PK se link ho, duplicate aur NULL allowed.<table><tr><th>Key</th><th>Unique</th><th>NULL</th><th>Count per table</th></tr><tr><td>Super</td><td>Haan</td><td>Ho sakti</td><td>Kai</td></tr><tr><td>Candidate</td><td>Haan</td><td>Ho sakti</td><td>Kai</td></tr><tr><td>Primary</td><td>Haan</td><td>Nahi</td><td>Sirf ek</td></tr><tr><td>Foreign</td><td>Nahi</td><td>Haan</td><td>Kai</td></tr></table><b>SQL:</b> <code>CREATE TABLE Student(RollNo INT PRIMARY KEY, Email VARCHAR(30) UNIQUE, Name VARCHAR(20));</code>`],
["Transaction aur ACID properties","5 times, must do",`<b>Transaction</b> = ek logical unit of work (read/write ka group). Ex: ₹500 transfer A→B.<div class="dg">{{txn}}</div><ul><li><b>A – Atomicity:</b> pura hoga ya bilkul nahi (debit ho gaya to credit bhi hoga).</li><li><b>C – Consistency:</b> txn se pehle/baad DB consistent (total balance same).</li><li><b>I – Isolation:</b> parallel txns ek dusre ko disturb nahi karte.</li><li><b>D – Durability:</b> commit ke baad data crash me bhi safe.</li></ul><b>Detail me (exam ke liye):</b><br><b>Atomicity:</b> Txn ke saare operations ya to pure ho ya koi nahi. Failure par <b>rollback</b> hota hai. Zimmedar: <b>Recovery Manager</b>. Ex: A se ₹500 kata par B me jama nahi hua, to debit wapas.<br><b>Consistency:</b> Txn DB ko ek valid state se dusri valid state me le jata hai (constraints na tute). Ex: A+B ka total txn ke baad bhi same. Zimmedar: programmer + DBMS.<br><b>Isolation:</b> Concurrent txns aise chalte hain jaise ek ke baad ek chal rahe hon. Ek ka uncommitted data dusra na dekhe. Zimmedar: <b>Concurrency Control Manager</b> (locking).<br><b>Durability:</b> Commit hone ke baad changes permanent, power failure me bhi. Zimmedar: Recovery Manager, log aur backup.<br><b>Transaction states:</b> Active (chal raha) → Partially Committed (last statement ho gaya) → Committed (disk par save) ya Failed → Aborted (rollback ke baad restart/kill).`],
["Checkpoint mechanism recovery me kaise help karta hai?","3 times",`Checkpoint par DBMS buffer ka data <b>disk par flush</b> karta hai aur log me checkpoint record likhta hai. Recovery me poora log nahi, sirf checkpoint ke baad ka part dekhna padta hai.<ul><li>Checkpoint se pehle commit → ignore</li><li>Checkpoint ke baad commit, crash se pehle → <b>REDO</b></li><li>Crash tak commit nahi → <b>UNDO</b></li></ul>Fayda: recovery time kam, log chhota.<br><b>Detail:</b> Bina checkpoint ke crash par poora log scan karna padta, jo bahut slow hai. <b>Checkpoint ke steps:</b> (1) naye txns thodi der rok do, (2) log buffer ko disk par likho, (3) modified data buffers disk par flush karo, (4) log me &lt;checkpoint L&gt; record likho (L = us waqt ke active txns ki list), (5) txns dobara chalu karo.<br><b>Recovery me:</b> last checkpoint record se start karo. Jo txn checkpoint se pehle commit ho chuke the unhe dekhne ki zarurat nahi. Checkpoint ke baad commit ho gaye → REDO. Jo commit nahi hue → UNDO. Isse recovery fast hoti hai aur log file ka size control me rehta hai.`],
["E-R model aur E-R diagram ke symbols","3 times",`E-R model real world ko <b>Entity, Attribute, Relationship</b> se dikhata hai.<div class="dg">{{er}}</div>Rectangle=entity, Double rect=weak entity, Ellipse=attribute, Double ellipse=multivalued, Dashed ellipse=derived, Diamond=relationship.<br><b>Detail:</b> <b>Entity:</b> real world ki cheez jo alag pehchani jaye (Student, Course). <b>Entity set:</b> same type ki entities ka group. <b>Attribute types:</b> simple (Roll), composite (Name = First+Last), single-valued, multivalued (Phone), derived (Age, DOB se). <b>Key attribute</b> par underline. <b>Relationship:</b> entities ke beech link (Student <b>enrolls</b> Course). Degree: unary, binary, ternary. <b>Cardinality:</b> 1:1 (Person-Passport), 1:N (Dept-Employee), M:N (Student-Course). <b>Participation:</b> total = double line, partial = single line.`],
["DBA ki responsibilities aur functions","3 times",`<ul><li><b>Design:</b> schema, tables, storage</li><li><b>Security:</b> authentication, privileges (GRANT/REVOKE)</li><li><b>Backup/Recovery:</b> regular backup, restore plan</li><li><b>Tuning:</b> indexes, query optimisation</li><li><b>Integrity & concurrency</b> monitor karna</li><li>Users ko training, DB ki upgradation</li></ul><b>Detail:</b> <b>DBA</b> = Database Administrator, DB ka sabse powerful user. Skills: DB design, SQL, OS aur networking ki knowledge.<ul><li><b>Schema definition:</b> DDL se conceptual aur internal schema banana</li><li><b>Storage structure/access method:</b> kaun si file organisation aur index use hogi</li><li><b>Schema aur physical organisation badalna</b> zarurat ke hisaab se</li><li><b>Authorization:</b> kisko kaunsa access (GRANT/REVOKE)</li><li><b>Integrity constraints</b> define karna</li><li><b>Backup aur recovery</b> ki policy, regular backup</li><li><b>Monitoring aur tuning:</b> slow queries, indexes, space</li><li><b>Users ki problems</b> solve karna, deadlock/concurrency dekhna</li></ul>`],
["Logical vs Physical data independence","3 times",`<table><tr><th></th><th>Logical</th><th>Physical</th></tr><tr><td>Badalta hai</td><td>Conceptual schema (attribute add/delete)</td><td>Storage/index/file structure</td></tr><tr><td>Bachta hai</td><td>External views, programs</td><td>Conceptual schema</td></tr><tr><td>Mushkil</td><td>Zyada</td><td>Kam</td></tr><tr><td>Mapping</td><td>External–Conceptual</td><td>Conceptual–Internal</td></tr></table><b>Detail:</b> <b>Logical independence</b> me conceptual schema badalte hain (naya attribute add, table split) par external views aur application programs ko change nahi karna padta. <b>Physical independence</b> me storage badalte hain (naya index, file organisation, disk) par conceptual schema same rehta hai. <b>Example:</b> Student table me Email column add karne par purane views chalte rahe = logical. Index banane par queries bina badle tez ho gayi = physical. Logical independence achieve karna mushkil hai kyunki programs schema par depend karte hain.`],
["Deadlock aur kab hota hai","3 times",`{{dead}}<b>Handling:</b><ul><li><b>Prevention:</b> wait-die, wound-wait, sab locks ek sath lena</li><li><b>Detection:</b> wait-for graph me cycle dhundo</li><li><b>Recovery:</b> ek victim txn rollback karo</li></ul><b>Deadlock hone ki 4 conditions:</b> (1) <b>Mutual exclusion</b> (resource ek time par ek txn ko), (2) <b>Hold and wait</b>, (3) <b>No preemption</b>, (4) <b>Circular wait</b>.<br><b>Example:</b> T1 ne R1 lock kiya aur R2 maanga, T2 ne R2 lock kiya aur R1 maanga, dono ruke hain.<br><b>Wait-die</b> (non-preemptive): purana txn naye ka wait karta hai, naya txn die (rollback). <b>Wound-wait</b> (preemptive): purana txn naye ko wound karta hai (rollback), naya purane ka wait karta hai.<br><b>Victim selection:</b> jisme kam kaam hua ho ya jo kam resources le raha ho.`],
["Referential integrity constraint (example)","3 times",`FK ki value ya to parent PK se match kare ya NULL ho.<pre>CREATE TABLE Dept(DID INT PRIMARY KEY, DName VARCHAR(20));\nCREATE TABLE Emp(EID INT PRIMARY KEY, DID INT,\n FOREIGN KEY(DID) REFERENCES Dept(DID)\n ON DELETE CASCADE);</pre>Dept me DID=1 hai to Emp me DID=5 insert nahi hoga.<br><b>Detail:</b> Do tables ke beech data consistent rakhne ka rule. <b>Parent</b> table (Dept, PK) aur <b>child</b> table (Emp, FK). Violation 3 jagah: (1) child me aisi FK insert jo parent me nahi, (2) parent ki row delete jisse child orphan ho, (3) parent ki PK update.<br><b>Actions:</b> ON DELETE <b>CASCADE</b> (child bhi delete), <b>SET NULL</b> (FK NULL), <b>RESTRICT</b> (delete roko).<br><b>Example:</b> Dept(10,IT) hai. <code>INSERT INTO Emp VALUES(1,'Ravi',10)</code> theek, <code>INSERT INTO Emp VALUES(2,'Amit',99)</code> reject.`],
["DML commands","3 times",`<pre>INSERT INTO emp VALUES(1,'Ravi',30000);\nUPDATE emp SET sal=35000 WHERE id=1;\nDELETE FROM emp WHERE id=1;\nSELECT name,sal FROM emp WHERE sal>20000;</pre><b>INSERT</b> naya row, <b>UPDATE</b> change, <b>DELETE</b> row hataye, <b>SELECT</b> data nikale.<br><b>Detail:</b> DML data ko manipulate karta hai, structure nahi. Rollback ho sakta hai.<ul><li><b>INSERT</b> (column list ke sath): <code>INSERT INTO emp(id,name) VALUES(2,'Amit');</code></li><li><b>UPDATE</b> bina WHERE ke sab rows badal deta hai, isliye WHERE zaroor lagao.</li><li><b>DELETE FROM emp;</b> sab rows hatata hai, table rehta hai.</li><li><b>SELECT</b> clauses: WHERE, ORDER BY, GROUP BY, HAVING. <code>SELECT * FROM emp ORDER BY sal DESC;</code></li></ul>`],
["Functional dependency aur normalization me role","3 times",`FD hi batati hai ki kaun si attribute kis par depend karti hai. Normalization me <b>FDs dekh kar</b> partial aur transitive dependency pehchaan kar table todte hain (2NF: partial hatao, 3NF: transitive hatao, BCNF: determinant = super key).<br><b>Detail:</b> FD X→Y = X ki value Y ko uniquely tay kare. <b>Example:</b> Emp(EID, Name, DID, DName): EID→Name, EID→DID, DID→DName. <b>Role:</b> (1) <b>Candidate key</b> nikalne me (closure se), (2) <b>2NF</b> me partial FD pehchan kar hatana, (3) <b>3NF</b> me transitive FD EID→DID→DName hatana, jisse Emp(EID,Name,DID) aur Dept(DID,DName) bante hain, (4) <b>BCNF</b> check karna, (5) <b>lossless decomposition</b> aur dependency preservation verify karna, (6) <b>redundancy aur anomalies</b> rokna. FD ke bina normalization possible hi nahi.`],
["Anomalies aur unka solution","3 times",`Table: <b>Stu(Roll, Name, Course, Fee)</b> (course ki fee har row me repeat)<ul><li><b>Insertion:</b> student ke bina naya course add nahi ho sakta</li><li><b>Deletion:</b> last student hataya to course info bhi gayi</li><li><b>Update:</b> fee badli to har row badalni padegi (inconsistency)</li></ul><b>Solution:</b> Normalization – Stu(Roll,Name,Course) aur Course(Course,Fee).<br><b>Solved example:</b> Table (Roll, Name, Course, Fee): (1,Ravi,DBMS,5000), (2,Amit,DBMS,5000), (3,Neha,OS,4000).<ul><li><b>Insertion anomaly:</b> 'Java' course naya hai par koi student nahi, to uski fee table me daal hi nahi sakte (Roll key hai, NULL nahi)</li><li><b>Deletion anomaly:</b> Neha (3) ko delete kiya to OS aur uski fee 4000 ki info bhi khatam</li><li><b>Update anomaly:</b> DBMS ki fee 5000 se 6000 karni hai, 2 rows badalni padengi, ek chhuti to data inconsistent</li></ul><b>Fix:</b> Stu(Roll,Name,Course) + Course(Course,Fee). Ab fee ek jagah hai, Java bina student ke bhi Course me add ho sakta hai, aur Neha delete par OS bacha rahega.`],
["Closure of FDs aur Candidate key (numerical)","3 times",`R(A,B,C,D), F = {A→B, B→C, C→D}<br><b>Steps:</b> {A}⁺ = {A} → A→B se {A,B} → B→C se {A,B,C} → C→D se {A,B,C,D}.<br>{A}⁺ = poori R ⇒ <b>A candidate key</b> (single attribute, to minimal bhi). Rule: jo attribute kisi ke right side me nahi aati wo key me zaroor hoti hai.<br><b>Closure ka matlab:</b> X⁺ = un sab attributes ka set jo X se FDs dwara nikal sakte hain. Agar X⁺ = poori relation, to X <b>super key</b>.<br><b>Example 2:</b> R(A,B,C,D,E), F = {A→B, BC→D, D→E}. {A,C}⁺: A→B se {A,B,C}, BC→D se {A,B,C,D}, D→E se {A,B,C,D,E} = poori R. A ya C ko alag check karo: {A}⁺={A,B}, {C}⁺={C}, dono poore nahi, isliye <b>AC candidate key</b> hai (minimal).<br><b>Steps:</b> (1) jo attributes kisi FD ke RHS me nahi unhe key me lo, (2) unka closure nikalo, (3) poora na ho to aur attributes jodo, (4) minimal check karo.`],
["Log files aur unka maintenance","2 times",`Log me records: <code>&lt;T1 start&gt;</code>, <code>&lt;T1, X, old, new&gt;</code>, <code>&lt;T1 commit&gt;</code>. <b>Write-Ahead Logging:</b> data disk par likhne se <b>pehle</b> log likho. Log <b>stable storage</b> me rakha jata hai, checkpoint ke baad purana log archive/delete hota hai.<br><b>Detail:</b> <b>Log record types:</b> &lt;T, start&gt;, &lt;T, X, V1, V2&gt; (X ki old value V1, new value V2), &lt;T, commit&gt;, &lt;T, abort&gt;. <b>Example:</b> &lt;T1,start&gt; &lt;T1,A,100,50&gt; &lt;T1,B,100,150&gt; &lt;T1,commit&gt;. Crash ke baad T1 commit hai to REDO (A=50,B=150), commit na ho to UNDO (A=100,B=100 wapas).<br><b>Maintenance:</b> (1) <b>Write-ahead rule:</b> DB me data likhne se pehle uska log disk par, (2) commit se pehle log force-write, (3) log ko <b>stable storage</b> ya mirrored disk par rakhna, (4) checkpoint ke baad purane log ko archive karna taaki size na bade, (5) log ka regular backup.`],
["Data model aur uske types","2 times",`Data model = data ko describe karne ka tarika (structure, relations, constraints). Types: <b>Hierarchical</b> (tree), <b>Network</b> (graph), <b>Relational</b> (tables), <b>E-R</b>, <b>Object-oriented</b>.<br><b>Detail:</b> Data model 3 cheezein define karta hai: <b>structure</b>, <b>operations</b> aur <b>constraints</b>.<ul><li><b>Hierarchical:</b> tree, parent-child 1:N, ek child ka ek hi parent (IBM IMS). Fast par flexible nahi.</li><li><b>Network:</b> graph, child ke kai parents (M:N), pointers. Complex.</li><li><b>Relational:</b> tables aur keys, SQL, sabse popular (MySQL, Oracle).</li><li><b>E-R:</b> design ke liye graphical conceptual model.</li><li><b>Object-oriented:</b> data aur methods objects me, inheritance support.</li></ul>`],
["Locking techniques (concurrency control)","2 times",`<ul><li><b>Shared lock (S):</b> sirf read, kai txn le sakte hain</li><li><b>Exclusive lock (X):</b> read+write, sirf ek txn</li><li><b>2-Phase Locking:</b> Growing (lock lo) → Shrinking (lock chhodo), phir naya lock nahi</li></ul><table><tr><th></th><th>S</th><th>X</th></tr><tr><th>S</th><td>✔</td><td>✘</td></tr><tr><th>X</th><td>✘</td><td>✘</td></tr></table><b>Detail:</b> Locking isolation deta hai. Txn pehle lock leta hai, kaam ke baad unlock. <b>Two-Phase Locking (2PL):</b> <b>Growing phase</b> me sirf lock lo, <b>Shrinking phase</b> me sirf chhodo. Ek baar unlock kiya to naya lock nahi. 2PL se schedule <b>serializable</b> hota hai. <b>Strict 2PL:</b> exclusive lock commit tak rakho (cascading rollback nahi). Problem: 2PL me deadlock ho sakta hai. <b>Example:</b> T1 Lock-X(A), read, write, Unlock(A). T2 ko A tab milta hai jab T1 unlock kare.`],
["Specialization vs Generalization","2026",`<b>Specialization:</b> top-down, ek entity ko sub-groups me todna (Person → Student, Teacher). <b>Generalization:</b> bottom-up, common attributes wali entities ko jodna (Car + Bike → Vehicle). Dono ISA relationship se dikhate hain.<div class='dg'><svg viewBox='0 0 520 210'><path class='l' d='M260 60V90M260 120L130 150M260 120L390 150'/><rect class='s pl' x='200' y='20' width='120' height='40'/><text x='260' y='45'>PERSON</text><polygon class='s' points='260,90 285,120 235,120'/><text class='m' x='260' y='112'>ISA</text><rect class='s' x='70' y='150' width='120' height='40'/><text x='130' y='175'>STUDENT</text><rect class='s' x='330' y='150' width='120' height='40'/><text x='390' y='175'>TEACHER</text><text class='m' x='130' y='203'>top-down = Specialization</text><text class='m' x='390' y='203'>bottom-up = Generalization</text></svg></div><b>Detail:</b> <b>Specialization</b> me ek entity ko uski alag-alag attributes ke hisaab se sub-entities me todte hain. Person(Name,Age) → Student(+Roll), Teacher(+Salary). <b>Generalization</b> me kai entities ke common attributes nikal kar ek super-entity banate hain: Car aur Truck → Vehicle(RegNo, Color). <b>Constraints:</b> disjoint/overlapping aur total/partial. Sub-entities super-entity ki attributes inherit karti hain.`],
["Hashing (example ke sath)","2024",`Key se seedha address nikalna: <b>h(k) = k mod 5</b>. Keys 12, 25, 17 → buckets 2, 0, 2. Bucket 2 me <b>collision</b> – solve: chaining/overflow. Fayda: tez search O(1).<div class='dg'><svg viewBox='0 0 520 230'><rect class='s' x='10' y='80' width='150' height='60' rx='10'/><text x='85' y='105'>Keys: 12,25,17,30,8</text><text class='m' x='85' y='125'>h(k) = k mod 5</text><path class='l' d='M160 110L260 25M160 110L260 65M160 110L260 105M160 110L260 145M160 110L260 185'/><rect class='s' x='260' y='10' width='240' height='30'/><text x='300' y='30'>0:</text><text x='400' y='30'>25 → 30</text><rect class='s' x='260' y='50' width='240' height='30'/><text x='300' y='70'>1:</text><text x='400' y='70'>(khaali)</text><rect class='s pl' x='260' y='90' width='240' height='30'/><text x='300' y='110'>2:</text><text x='400' y='110'>12 → 17 (collision)</text><rect class='s' x='260' y='130' width='240' height='30'/><text x='300' y='150'>3:</text><text x='400' y='150'>8</text><rect class='s' x='260' y='170' width='240' height='30'/><text x='300' y='190'>4:</text><text x='400' y='190'>(khaali)</text></svg></div><b>Detail:</b> <b>Hash function</b> key ko bucket address me badalta hai. <b>Static hashing:</b> buckets fixed. <b>Dynamic hashing:</b> data badhne par buckets badhte hain. <b>Collision:</b> do keys ka same bucket. <b>Solutions:</b> chaining (linked list, jaise upar), open addressing (linear probing: agla khaali slot). Search: h(17)=2 → bucket 2 me dhundo. Best case O(1). Nuksaan: range queries aur sorted order ke liye acha nahi.`],
["Authentication vs Authorization","2024",`<b>Authentication:</b> tum kaun ho? (login, password, OTP). <b>Authorization:</b> tum kya kar sakte ho? (GRANT/REVOKE, privileges). Pehle authentication, phir authorization.<table><tr><th></th><th>Authentication</th><th>Authorization</th></tr><tr><td>Sawal</td><td>Tum kaun ho?</td><td>Tum kya kar sakte ho?</td></tr><tr><td>Kab</td><td>Pehle</td><td>Authentication ke baad</td></tr><tr><td>Tareeka</td><td>Password, OTP, biometric</td><td>GRANT/REVOKE, roles</td></tr><tr><td>Example</td><td>Login karna</td><td>User sirf SELECT kar sakta hai</td></tr></table><pre>GRANT SELECT, INSERT ON emp TO ravi;
REVOKE INSERT ON emp FROM ravi;</pre>`],
["Inheritance par short note","2023",`Subclass apni superclass ki attributes aur methods <b>inherit</b> karti hai (IS-A). Ex: Person(name,age) → Student (+roll). Types: single, multiple, multilevel. Reusability badhti hai. ER me specialization/generalization se juda hai.<br><b>Detail:</b> <b>Super class:</b> Person(Name,Age). <b>Sub class:</b> Student(Roll), jo super ki attributes inherit karti hai aur apni extra rakhti hai. <b>Types:</b> single (ek parent), <b>multiple</b> (do parents, jaise TA = Student + Employee), multilevel (Person → Employee → Manager), hierarchical. <b>Faayde:</b> reusability, redundancy kam, natural modelling. <b>Object-oriented DB</b> me methods bhi inherit hote hain.`]]],
["C","Section C · 20 marks (400 words) · Attempt 2 out of 4",[
["ANSI-SPARC 3 level architecture + data independence","Diagram must",`<div class="dg">{{arch}}</div><ul><li><b>External:</b> har user ka apna view, baki data chhupa.</li><li><b>Conceptual:</b> poore DB ka logical design, constraints, relations.</li><li><b>Internal:</b> physical storage, indexes, file organisation.</li></ul><b>Data independence:</b> levels ke beech mappings se ek level ka change dusre ko affect nahi karta (logical + physical).<br><b>Introduction:</b> ANSI-SPARC architecture (1975) DBMS ko 3 levels me baantta hai taaki user ko storage ki details na dikhein aur har user ko apna alag view mile.<br><b>1. External level:</b> sabse upar, user ka view. Ek DB ke kai external views ho sakte hain (Clerk sirf name/phone dekhe, Manager salary bhi).<br><b>2. Conceptual level:</b> beech ka level, poore DB ka logical structure: entities, attributes, relationships, constraints. Poore DB ka ek hi conceptual schema hota hai. DBA isse design karta hai.<br><b>3. Internal level:</b> sabse neeche, data physically disk par kaise store hai: file organisation, indexes, hashing, record format.<br><b>Mappings:</b> External/Conceptual mapping (view → tables) aur Conceptual/Internal mapping (tables → files).<br><b>Data independence:</b><ul><li><b>Logical:</b> conceptual schema badlo (naya column), external views/programs same chalenge.</li><li><b>Physical:</b> storage ya index badlo, conceptual schema same rahega.</li></ul><b>Advantages:</b> flexibility, security (views se data chhupta hai), kam maintenance cost, har user ko simple view.<br><b>Exam tip:</b> diagram me 3 boxes + dono mappings ke arrows zaroor banao.`],
["Normalization: 1NF, 2NF, 3NF + anomalies","Must do",`<div class="dg">{{norm}}</div><table><tr><th>Form</th><th>Condition</th></tr><tr><td>1NF</td><td>Har cell atomic, repeating group nahi</td></tr><tr><td>2NF</td><td>1NF + koi partial dependency nahi</td></tr><tr><td>3NF</td><td>2NF + koi transitive dependency nahi</td></tr></table><b>Example:</b> (Roll, Course, CName, Fee) key=(Roll,Course). Course→CName,Fee partial hai ⇒ 2NF me Stu(Roll,Course) + Course(Course,CName,Fee). Phir transitive hatao ⇒ 3NF.<br><b>Introduction:</b> Normalization = relations ko chhote tables me todna jisse redundancy aur anomalies hat jaayein. Concept: E.F. Codd.<br><b>Pehle anomalies (kyun zaroori):</b> Table <b>Stu(Roll, Name, Course, CName, Fee)</b> me (a) <b>Insertion:</b> student ke bina naya course add nahi hota, (b) <b>Deletion:</b> last student delete karne par course info bhi udd jati hai, (c) <b>Update:</b> fee badli to har row badalni padegi, ek bhi chhuti to inconsistency.<br><b>1NF:</b> har cell me ek hi (atomic) value, repeating group nahi. Ex: Roll=1, Course='DBMS, OS' galat. Fix: (1,DBMS) aur (1,OS) alag rows.<br><b>2NF:</b> 1NF + koi <b>partial dependency</b> nahi. Matlab non-key attribute poori composite key par depend kare, uske hisse par nahi. Key=(Roll,Course); Course→CName,Fee partial hai. Decompose: <b>Stu(Roll,Name,Course)</b> aur <b>Course(Course,CName,Fee)</b>.<br><b>3NF:</b> 2NF + koi <b>transitive dependency</b> nahi. Ex: Emp(EID, DeptID, DeptName): EID→DeptID, DeptID→DeptName, to EID→DeptName transitive. Decompose: Emp(EID,DeptID) aur Dept(DeptID,DeptName).<br><b>BCNF (bonus):</b> har FD me determinant super key ho.<br><b>Faayde:</b> redundancy kam, anomalies khatam, storage bachti hai, data consistent. <b>Nuksaan:</b> zyada tables, join se query slow.`],
["Relational algebra operators (examples)","Must do",`<table><tr><th>Op</th><th>Symbol</th><th>Kaam</th></tr><tr><td>Select</td><td>σ</td><td>Rows filter: σ sal&gt;20000(Emp)</td></tr><tr><td>Project</td><td>π</td><td>Columns chuno: π name(Emp)</td></tr><tr><td>Union</td><td>∪</td><td>Dono relations ke rows (duplicate hata ke)</td></tr><tr><td>Difference</td><td>−</td><td>R me hai, S me nahi</td></tr><tr><td>Intersection</td><td>∩</td><td>Common rows</td></tr><tr><td>Cartesian</td><td>×</td><td>Har row × har row</td></tr><tr><td>Join</td><td>⋈</td><td>Common attribute par jodna: Emp ⋈ Dept</td></tr><tr><td>Rename</td><td>ρ</td><td>Naam badalna</td></tr></table><b>Example tables:</b><br>Emp(EID, Name, Sal, DID): (1,Ravi,30000,10), (2,Amit,20000,20), (3,Neha,40000,10)<br>Dept(DID, DName): (10,IT), (20,HR)<ul><li><b>σ Sal&gt;25000 (Emp)</b> → Ravi, Neha wali rows (selection = horizontal filter)</li><li><b>π Name, Sal (Emp)</b> → sirf do columns (projection = vertical filter)</li><li><b>Emp ⋈ Dept</b> (DID match) → (1,Ravi,30000,10,IT), (2,Amit,20000,20,HR), (3,Neha,40000,10,IT)</li><li><b>π Name (σ DID=10 (Emp))</b> → Ravi, Neha (operators ko combine kar sakte hain)</li><li><b>R ∪ S, R − S, R ∩ S</b> ke liye dono relations <b>union-compatible</b> hone chahiye (same attributes/domain)</li><li><b>Cartesian R × S:</b> R ke 3 aur S ke 2 rows ⇒ 6 rows</li></ul>Join ke types: Natural, Theta (condition), Equi, Outer.`],
["E-R model: diagram, other models se difference, advantages","Must do",`<div class="dg">{{er}}</div><b>Difference:</b> E-R conceptual design ke liye graphical hai; relational model tables/tuples par based implementation model hai; hierarchical/network me pointers use hote hain.<br><b>Introduction:</b> E-R model (Peter Chen, 1976) real world ko 3 cheezon se dikhata hai: <b>Entity</b> (Student), <b>Attribute</b> (Roll, Name), <b>Relationship</b> (Enrolls).<br><b>Real example: Student enrolls in Course (M:N)</b><div class="dg"><svg viewBox="0 0 560 260"><path class="l" d="M80 110L55 70M110 110L135 70M80 150L90 190M130 130H225M335 130H430M470 110L450 70M500 150L520 190"/><ellipse class="s" cx="50" cy="50" rx="38" ry="20"/><text x="50" y="55" style="text-decoration:underline">Roll</text><ellipse class="s" cx="140" cy="50" rx="38" ry="20"/><text x="140" y="55">Name</text><ellipse class="s" cx="90" cy="212" rx="42" ry="20"/><ellipse class="s" cx="90" cy="212" rx="35" ry="14" style="fill:none"/><text x="90" y="217">Phone</text><rect class="s pl" x="30" y="110" width="100" height="40"/><text x="80" y="135">STUDENT</text><polygon class="s" points="280,95 335,130 280,165 225,130"/><text x="280" y="134">Enrolls</text><rect class="s pl" x="430" y="110" width="100" height="40"/><text x="480" y="135">COURSE</text><ellipse class="s" cx="440" cy="50" rx="38" ry="20"/><text x="440" y="55" style="text-decoration:underline">CID</text><ellipse class="s" cx="515" cy="212" rx="42" ry="20"/><text x="515" y="217">CName</text><text class="m" x="160" y="122">M</text><text class="m" x="400" y="122">N</text><text class="m" x="280" y="245">Underline = Primary Key, Double ellipse = Multivalued</text></svg></div><b>Mapping cardinality:</b> 1:1, 1:N, M:N. <b>Participation:</b> total (double line) ya partial.<br><b>Relational me convert:</b> STUDENT(Roll,Name), COURSE(CID,CName), ENROLLS(Roll,CID) – M:N ke liye alag table, jisme dono FK.<br><b>Other models se difference:</b> Hierarchical me tree aur pointers, Network me graph/links, Relational me tables. E-R sirf design (conceptual) model hai, seedha implement nahi hota.<br><b>Advantages:</b> samajhna aasan, graphical, DB design se pehle planning, relational me convert karna simple, users aur designers ke beech communication, redundancy design me hi dikh jati hai. <b>Limitations:</b> sab constraints nahi dikha sakta, bade DB me diagram complex.`],
["Relational model aur RDBMS ki characteristics","3 times",`Data <b>tables (relations)</b> me: row = tuple, column = attribute, domain = allowed values. Codd (1970).<ul><li>Data tables me store, har table ka unique naam</li><li>Row-order ka matter nahi, har row unique (PK)</li><li>Keys aur integrity constraints support</li><li>SQL se query, normalization possible</li><li>Multi-user access, security, ACID transactions</li><li>Physical data independence</li></ul>`],
["SQL queries (Employee–Company)","Must do",`<pre>CREATE TABLE emp(eid INT PRIMARY KEY,name VARCHAR(30),\n sal INT, city VARCHAR(20), cid INT);\n-- 1. sab employees\nSELECT * FROM emp;\n-- 2. sal > 30000\nSELECT name FROM emp WHERE sal>30000;\n-- 3. city wise count\nSELECT city,COUNT(*) FROM emp GROUP BY city;\n-- 4. highest salary\nSELECT MAX(sal) FROM emp;\n-- 5. join company\nSELECT e.name,c.cname FROM emp e\n JOIN company c ON e.cid=c.cid;\n-- 6. sal badhao\nUPDATE emp SET sal=sal+2000 WHERE city='Kanpur';\n-- 7. order\nSELECT * FROM emp ORDER BY sal DESC;</pre>`],
["DDL aur DML (CREATE, ALTER, DROP, TRUNCATE, INSERT, DELETE)","3 times",`<b>DDL</b> (structure): <pre>CREATE TABLE s(id INT, name VARCHAR(20));\nALTER TABLE s ADD age INT;\nTRUNCATE TABLE s;  -- sab rows, structure rahega\nDROP TABLE s;      -- poora table gaya</pre><b>DML</b> (data): <pre>INSERT INTO s VALUES(1,'Amit',20);\nUPDATE s SET age=21 WHERE id=1;\nDELETE FROM s WHERE id=1;  -- rollback ho sakta</pre>TRUNCATE/DROP auto-commit hote hain, DELETE me WHERE lag sakta hai.`],
["Concurrency control: lost update, inconsistent retrieval, locking","3 times",`<ul><li><b>Lost update:</b> T1 aur T2 ek hi X padhte hain, dono update karte hain, ek ka update overwrite ho jata hai. (X=100, T1 +50, T2 −30 → 120/70 jo galat)</li><li><b>Inconsistent retrieval:</b> T1 transfer chal raha, beech me T2 total padh leta hai → galat sum.</li></ul><b>Lost update example (X=100):</b><table><tr><th>Time</th><th>T1</th><th>T2</th><th>X</th></tr><tr><td>t1</td><td>Read X (100)</td><td></td><td>100</td></tr><tr><td>t2</td><td></td><td>Read X (100)</td><td>100</td></tr><tr><td>t3</td><td>X=X+50, Write</td><td></td><td>150</td></tr><tr><td>t4</td><td></td><td>X=X−30, Write</td><td>70 ❌</td></tr></table>Sahi answer 120 hona chahiye tha, T1 ka +50 kho gaya.<br><b>Inconsistent retrieval:</b> A=100, B=100 (total 200). T1 A se 50 B me transfer kar raha. T2 beech me A (50) padhta hai, B (100) padhta hai, total 150 ❌.<br><b>Solution:</b> locking ya timestamps. Txn data item ko lock karke hi use kare.<br>{{B15}}`],
["Functional dependency: types aur normalization me role","3 times",`<ul><li><b>Trivial:</b> A,B→A</li><li><b>Non-trivial:</b> A→B (B, A ka subset nahi)</li><li><b>Full:</b> pura composite key chahiye</li><li><b>Partial:</b> key ke ek hisse par depend (2NF violate)</li><li><b>Transitive:</b> A→B→C (3NF violate)</li><li><b>Multivalued:</b> A↠B (4NF)</li></ul><b>Exam example:</b> R(Roll, Name, Course, Fee), key=(Roll,Course):<ul><li><b>Trivial:</b> {Roll,Name}→Roll</li><li><b>Non-trivial:</b> Roll→Name</li><li><b>Partial:</b> Course→Fee (key ke ek hisse par)</li><li><b>Full:</b> {Roll,Course}→Marks</li></ul><b>Armstrong axioms:</b> Reflexivity (Y⊆X ⇒ X→Y), Augmentation (X→Y ⇒ XZ→YZ), Transitivity (X→Y, Y→Z ⇒ X→Z).<br><b>Normalization me role:</b> FD se partial/transitive dependency pata chalti hai, uske hisaab se 2NF/3NF/BCNF me table todte hain, aur candidate key bhi closure se nikalte hain. {{B10}}`],
["Transaction aur ACID (detail)","Must do",`{{B2}}`],
["Integrity constraints ke types","3 times",`<ul><li><b>Domain:</b> value allowed range/type me (CHECK age&gt;18)</li><li><b>Entity:</b> PK unique aur NOT NULL</li><li><b>Referential:</b> FK = parent PK ya NULL</li><li><b>Key:</b> UNIQUE values</li><li><b>NOT NULL / Default</b> constraints</li></ul><b>Detail:</b> <b>Domain</b> attribute ki valid values tay karta hai (CHECK, data type). <b>Entity integrity:</b> PK kabhi NULL ya duplicate nahi. <b>Referential:</b> FK parent me exist kare, DELETE/UPDATE par CASCADE, SET NULL ya RESTRICT choose kar sakte hain. <b>Key constraint:</b> UNIQUE se alternate key. Faayde: galat data ruka, DB consistent, bugs kam.<pre>CREATE TABLE emp(id INT PRIMARY KEY,\n email VARCHAR(30) UNIQUE,\n age INT CHECK(age>=18),\n did INT REFERENCES dept(did));</pre>`],
["DBA responsibilities + physical vs logical independence","3 times",`<b>DBA:</b> {{B5}}<br><b>Independence:</b> {{B6}}`],
["Recovery: checkpoint aur log files","3 times",`Recovery = failure ke baad DB ko consistent banana.<br><b>Log:</b> {{B13}}<br><b>Checkpoint:</b> {{B3}}<br><b>Real example (crash ke waqt):</b><div class="dg"><svg viewBox="0 0 560 220"><rect class="s" x="40" y="20" width="120" height="28"/><text x="100" y="39">T1 commit</text><rect class="s" x="170" y="60" width="170" height="28"/><text x="255" y="79">T2 commit</text><rect class="s pl" x="190" y="100" width="230" height="28"/><text x="305" y="119">T3 chal raha tha</text><path class="l" d="M200 10V150"/><text class="m" x="200" y="165">CHECKPOINT</text><path class="l" d="M420 10V150" style="stroke:#dc2626"/><text class="m" x="420" y="165">CRASH ✘</text><text class="m" x="480" y="39">T1: ignore</text><text class="m" x="480" y="79">T2: REDO</text><text class="m" x="490" y="119">T3: UNDO</text></svg></div><b>Recovery steps:</b> (1) log me last checkpoint dhundo, (2) checkpoint ke baad ke txns ki list banao, (3) jinka &lt;commit&gt; hai unhe REDO, (4) baki ko UNDO (old value wapas).<br><b>Techniques:</b> <b>Deferred update:</b> commit se pehle DB me kuch nahi likhte, log me hi rakhte hain (redo chahiye). <b>Immediate update:</b> pehle log, phir turant DB (undo + redo dono). <b>Shadow paging:</b> page ki copy par kaam, commit par pointer badalte hain, log nahi chahiye.<br><b>Backup:</b> full, incremental aur disk failure ke liye mirroring.`]]],
["X","Extra · Syllabus se aa sakte hain (abhi tak nahi pooche)",[
["BCNF aur 1NF","Extra",`<b>1NF:</b> atomic values, no repeating groups (Phone: "1,2" ❌ → alag rows).<br><b>BCNF:</b> har non-trivial FD <b>X→Y</b> me X <b>super key</b> hona chahiye. 3NF se strict. Ex: R(Stu,Subj,Teacher), Teacher→Subj, Teacher key nahi ⇒ split: (Teacher,Subj), (Stu,Teacher).`],
["SQL Joins (Inner, Outer)","Extra",`<pre>-- INNER: sirf matching rows\nSELECT * FROM A INNER JOIN B ON A.id=B.id;\n-- LEFT OUTER: A ke sab + matching B\n-- RIGHT OUTER: B ke sab + matching A\n-- FULL OUTER: dono ke sab rows</pre>Unmatched side par NULL aata hai.`],
["Views in SQL","Extra",`View = virtual table (stored query), data nahi store karta. Security aur simplicity ke liye.<pre>CREATE VIEW rich AS\nSELECT name,sal FROM emp WHERE sal>50000;\nSELECT * FROM rich;\nDROP VIEW rich;</pre>`],
["Indexing aur B-tree","Extra",`Index = book ke index jaisa, search tez. <b>B-tree:</b> balanced tree, har node me kai keys, sab leaf same level, search/insert/delete O(log n). B+ tree me data sirf leaves me aur leaves linked hote hain (range query fast).`],
["Serializability aur Timestamp ordering","Extra",`<b>Serializable schedule:</b> concurrent schedule jiska result kisi serial schedule jaisa ho (conflict ya view serializable; precedence graph me cycle nahi). <b>Timestamp ordering:</b> har txn ko TS milta hai, older txn pehle chalta hai; conflict par younger txn rollback.`],
["Aggregate functions aur GROUP BY","Extra",`<pre>SELECT dept,COUNT(*),AVG(sal),MAX(sal),MIN(sal),SUM(sal)\nFROM emp GROUP BY dept HAVING AVG(sal)>20000;</pre>GROUP BY rows ko groups me baantta hai, HAVING group par filter lagata hai (WHERE row par).`],
["DBMS vs File system (advantages of DBMS)","Extra",`<ul><li>Redundancy aur inconsistency kam</li><li>Data sharing, security, integrity</li><li>Concurrency control, backup/recovery</li><li>Data independence, SQL se easy query</li></ul>File system me ye sab manual aur mushkil hai.`],
["Database security","Extra",`Unauthorized access se bachana. Methods: <b>authentication</b> (login), <b>authorization</b> (GRANT/REVOKE), views, encryption, backup, audit trail, firewall. Threats: SQL injection, data leak.`]]]
];
const ref={};sec.forEach(([k,,L])=>L.forEach((x,i)=>ref[k+(i+1)]=x[2]));

out.innerHTML=`<div class="sec">${s[1]}</div>`;

d.innerHTML=`<summary><i>${i+1}</i><span>${a}</span><em>${f}</em></summary><div class="a">${fx(h)}</div>`;out.append(d)})}
q.oninput=draw;let op=false;document.getElementById('all').onclick=()=>{op=!op;out.querySelectorAll('details').forEach(d=>d.open=op)};
document.getElementById('dl').onclick=()=>{location.href='DBMS-Important-Questions.pdf'};
draw();
